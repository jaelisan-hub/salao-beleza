<h2>Agendamentos</h2>

<a class="btn btn-success mb-3" href="/adicionar_agendamento">
    Novo Agendamento
</a>

{% for a in agendamentos %}
<div class="card p-2 mb-2">

    <b>Cliente:</b> {{ a.cliente.nome }} <br>
    <b>Serviço:</b> {{ a.servico }} <br>
    <b>Data:</b> {{ a.data }} - {{ a.hora }}

</div>
{% endfor %}

{% endblock %}
